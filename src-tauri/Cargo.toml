[package]
name = "void-skin-manager"
version = "1.1.0"
edition = "2021"
authors = ["VOID"]
description = "League of Legends custom skin & mod manager built with Tauri 2 and React"
license = "MIT"
repository = "https://github.com/ItzJPPPMe/Void-Manager"

[lib]
name = "void_skin_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = true, features = ["json", "stream"] }
walkdir = "2"
winreg = "0.56"
zip = "2"
